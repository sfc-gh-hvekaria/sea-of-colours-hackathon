<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Circuit FX</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;overflow:hidden;}
canvas{display:block;}
.btns{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;}
.btn{padding:9px 22px;background:rgba(0,0,0,.85);border:1px solid #446600;color:#aaff00;font-family:monospace;font-size:11px;cursor:pointer;letter-spacing:2px;text-transform:uppercase;}
.btn:hover,.btn.on{border-color:#aaff00;background:rgba(0,50,0,.5);}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="btns">
  <button class="btn on" id="bBoth"      onclick="run('both')">BOTH</button>
  <button class="btn"    id="bCircuits"  onclick="run('circuits')">CIRCUITS</button>
  <button class="btn"    id="bPixels"    onclick="run('pixels')">PIXELS</button>
</div>
<script>
'use strict';
const LIME='#aaff00', BLACK='#000';
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H;
function resize(){cv.width=W=innerWidth;cv.height=H=innerHeight;}
resize(); window.addEventListener('resize',resize);

document.querySelectorAll('.btn').forEach(b=>{
  b.addEventListener('click',()=>{
    document.querySelectorAll('.btn').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
});

// ══════════════════════════════════════════════════════════════════
// CIRCUIT LAYER
// ══════════════════════════════════════════════════════════════════
const CC=10, CFONT='9px ui-monospace,"Cascadia Code",monospace';

// RLUD nibble→char  (R=bit3 L=bit2 U=bit1 D=bit0)
const THIN=['·','│','│','│','─','┐','┘','┤','─','┌','└','├','─','┬','┴','┼'];
const BOLD=[' ','║','║','║','═','╗','╝','╣','═','╔','╚','╠','═','╦','╩','╬'];
// junction overlays
const VIAS=['⊕','⊗','○','●','◉'];
// label chars (component designators + signal names)
const LBLS=['U','B','A','R','C','Q','G','V','D','F','H','I','J','K','L','M','N','P','S','T',
            '1','2','3','4','5','6','7','8','9','0','+','-','='];

const DX=[1,0,-1,0], DY=[0,1,0,-1];
const MY=[8,1,4,2], OPP=[4,2,8,1]; // R D L U / L U R D

let ccSortedA, ccSortedB, ccSortedC, ccSortedD;

function buildOneLayer(){
  const ccCols=Math.floor(W/CC), ccRows=Math.floor(H/CC);
  const ccGrid=Array.from({length:ccRows*ccCols},()=>({rlud:0,time:1,bold:false,marked:false,dark:false,via:null,lbl:null}));

  function cc(r,c){return ccGrid[r*ccCols+c];}
  function ok(r,c){return r>=0&&r<ccRows&&c>=0&&c<ccCols;}

  // ── kernel centres ────────────────────────────────────────────────
  const NK=4+Math.floor(Math.random()*5);
  const kernels=Array.from({length:NK},(_,i)=>({
    r:Math.floor(Math.random()*ccRows),
    c:Math.floor(Math.random()*ccCols),
    base:i*0.05
  }));
  function kTime(r,c){
    let best=0,bd=1e9;
    for(const k of kernels){const d=Math.abs(r-k.r)+Math.abs(c-k.c);if(d<bd){bd=d;best=k.base;}}
    return best+bd*0.0012;
  }

  function mark(r,c,rlud,bold,t,drk=false){
    if(!ok(r,c))return;
    const ce=cc(r,c);
    ce.rlud|=rlud; ce.bold=ce.bold||bold; ce.dark=ce.dark||drk;
    if(!ce.marked){ce.marked=true;ce.time=t;}
    else ce.time=Math.min(ce.time,t);
  }

  // ── Manhattan routing helpers ─────────────────────────────────────
  function routeH(r,c1,c2,bold,t,drk=false){
    const dc=c2>c1?1:-1,dir=dc>0?0:2;
    for(let c=c1;c!==c2;c+=dc){
      if(!ok(r,c)||!ok(r,c+dc))break;
      mark(r,c,MY[dir],bold,t,drk); mark(r,c+dc,OPP[dir],bold,t,drk);
      t+=0.00022;
    }
  }
  function routeV(r1,r2,c,bold,t,drk=false){
    const dr=r2>r1?1:-1,dir=dr>0?1:3;
    for(let r=r1;r!==r2;r+=dr){
      if(!ok(r,c)||!ok(r+dr,c))break;
      mark(r,c,MY[dir],bold,t,drk); mark(r+dr,c,OPP[dir],bold,t,drk);
      t+=0.00022;
    }
  }
  function routeL(r1,c1,r2,c2,bold,t,drk=false){
    if(r1===r2){routeH(r1,c1,c2,bold,t,drk);return;}
    if(c1===c2){routeV(r1,r2,c1,bold,t,drk);return;}
    if(Math.random()<0.5){routeH(r1,c1,c2,bold,t,drk);routeV(r1,r2,c2,bold,t,drk);}
    else{routeV(r1,r2,c1,bold,t,drk);routeH(r2,c1,c2,bold,t,drk);}
  }

  // ── IC component boxes ────────────────────────────────────────────
  const N_IC=45+Math.floor(Math.random()*20);
  const icPins=[];
  const placed=[];
  for(let attempt=0;placed.length<N_IC&&attempt<N_IC*6;attempt++){
    const h=2+Math.floor(Math.random()*4);  // 2-5 rows
    const w=3+Math.floor(Math.random()*5);  // 3-7 cols
    const r0=1+Math.floor(Math.random()*(ccRows-h-2));
    const c0=1+Math.floor(Math.random()*(ccCols-w-2));
    // no overlap + 1-cell gap
    if(placed.some(p=>r0<p.r1+2&&r0+h>p.r0-1&&c0<p.c1+2&&c0+w>p.c0-1))continue;
    placed.push({r0,c0,r1:r0+h-1,c1:c0+w-1,idx:placed.length});

    const t=kTime(r0+Math.floor(h/2),c0+Math.floor(w/2));
    const bold=Math.random()<0.3;
    const isdark=Math.random()<0.35;
    // corners
    mark(r0,    c0,    0b1001,bold,t,isdark);
    mark(r0,    c0+w-1,0b0101,bold,t,isdark);
    mark(r0+h-1,c0,    0b1010,bold,t,isdark);
    mark(r0+h-1,c0+w-1,0b0110,bold,t,isdark);
    // top/bottom edges
    for(let dc=1;dc<w-1;dc++){mark(r0,c0+dc,0b1100,bold,t,isdark);mark(r0+h-1,c0+dc,0b1100,bold,t,isdark);}
    // side edges
    for(let dr=1;dr<h-1;dr++){mark(r0+dr,c0,0b0011,bold,t,isdark);mark(r0+dr,c0+w-1,0b0011,bold,t,isdark);}
    // interior content – style varies by box size
    {
      if(h<=2||w<=3){
        // tiny box: single designator
        const ce=cc(r0+Math.floor(h/2),c0+1);
        if(ce&&!ce.lbl){ce.lbl=LBLS[Math.floor(Math.random()*20)];ce.marked=true;ce.dark=isdark;ce.time=t+0.02;}
      } else {
        const style=Math.floor(Math.random()*5);
        const SIG='DACSQGNV', BITS='01011010110100101101';
        for(let dr=1;dr<h-1;dr++){
          for(let dc=1;dc<w-1;dc++){
            const ce=cc(r0+dr,c0+dc);
            if(!ce||ce.lbl)continue;
            let ch;
            if(style===0){ch=(dr+dc)%2===0?'+':'·';}
            else if(style===1){ch=BITS[(dr*(w-2)+dc)%BITS.length];}
            else if(style===2){ch='▪';}
            else if(style===3){ch=dc%2===1?SIG[(dr+dc)%8]:String(((dc-1)/2|0)%8);}
            else if(dc===1){ch=LBLS[Math.floor(Math.random()*20)];}
            else if(dc===2){ch=String(Math.floor(Math.random()*9)+1);}
            else continue;
            ce.lbl=ch; ce.marked=true; ce.dark=isdark; ce.time=t+0.02+dr*0.004+dc*0.001;
          }
        }
      }
    }
    // pins with stubs that visually connect to the box edge
    const icIdx=placed.length-1;
    for(let dr=1;dr<h-1;dr+=2){
      if(ok(r0+dr,c0-1)){
        mark(r0+dr,c0,    0b0100,bold,t,isdark);
        mark(r0+dr,c0-1,  0b1000,false,t+0.004,isdark);
        icPins.push({r:r0+dr,c:c0-1,icIdx,t:t+0.004,dark:isdark});
      }
      if(ok(r0+dr,c0+w)){
        mark(r0+dr,c0+w-1,0b1000,bold,t,isdark);
        mark(r0+dr,c0+w,  0b0100,false,t+0.004,isdark);
        icPins.push({r:r0+dr,c:c0+w,icIdx,t:t+0.004,dark:isdark});
      }
    }
    for(let dc=1;dc<w-1;dc+=2){
      if(ok(r0-1,c0+dc)){
        mark(r0,    c0+dc,0b0010,bold,t,isdark);
        mark(r0-1,  c0+dc,0b0001,false,t+0.004,isdark);
        icPins.push({r:r0-1,c:c0+dc,icIdx,t:t+0.004,dark:isdark});
      }
      if(ok(r0+h,c0+dc)){
        mark(r0+h-1,c0+dc,0b0001,bold,t,isdark);
        mark(r0+h,  c0+dc,0b0010,false,t+0.004,isdark);
        icPins.push({r:r0+h,c:c0+dc,icIdx,t:t+0.004,dark:isdark});
      }
    }
  }

  // ── dense component stamps ────────────────────────────────────────
  // memory arrays, connector pads, register blocks, coil patterns
  const N_STAMP=12+Math.floor(Math.random()*8);
  for(let si=0;si<N_STAMP;si++){
    const kind=Math.floor(Math.random()*4);
    const sh=kind===1?1:3+Math.floor(Math.random()*(kind===0?6:4));
    const sw=kind===1?8+Math.floor(Math.random()*14):5+Math.floor(Math.random()*9);
    const sr=1+Math.floor(Math.random()*(ccRows-sh-2));
    const sc=1+Math.floor(Math.random()*(ccCols-sw-2));
    const st=kTime(sr+sh/2,sc+sw/2)+0.10;
    const sdark=Math.random()<0.35;
    for(let dr=0;dr<sh;dr++){
      for(let dc=0;dc<sw;dc++){
        if(!ok(sr+dr,sc+dc))continue;
        const ce=cc(sr+dr,sc+dc);
        if(ce.marked)continue;
        let ch;
        if(kind===0){
          ch='01'[(dr^dc)&1]; if(dc%4===3)ch='·';
        }else if(kind===1){
          ch=dc%2===0?'▪':'·';
        }else if(kind===2){
          ch='0123456789ABCDEF'[Math.floor(Math.random()*16)];
          if(dc%3===2)ch='·';
        }else{
          ch=(dr+dc)%2===0?'╬':'·';
        }
        ce.lbl=ch; ce.marked=true; ce.dark=sdark; ce.time=st+dr*0.005+dc*0.001;
      }
    }
  }

  // ── short parallel bus segments ───────────────────────────────────
  const N_BUS=7+Math.floor(Math.random()*6);
  for(let bi=0;bi<N_BUS;bi++){
    const horiz=Math.random()<0.55;
    const nLines=2+Math.floor(Math.random()*3);
    const len=8+Math.floor(Math.random()*18);
    const br=1+Math.floor(Math.random()*(ccRows-nLines-1));
    const bc=1+Math.floor(Math.random()*(ccCols-len-1));
    const bt=kTime(br+nLines/2,bc+len/2)+0.06;
    const bdark=Math.random()<0.3;
    for(let li=0;li<nLines;li++){
      if(horiz)routeH(br+li,bc,bc+len,false,bt+li*0.008,bdark);
      else routeV(br,br+len,bc+li,false,bt+li*0.008,bdark);
    }
  }

  // ── L-route nearby IC pins together ──────────────────────────────
  const usedPins=new Set();
  const shuffled=[...icPins].sort(()=>Math.random()-0.5);
  for(let i=0;i<shuffled.length;i++){
    if(usedPins.has(i))continue;
    const p=shuffled[i];
    let bestJ=-1,bestD=30;
    for(let j=0;j<shuffled.length;j++){
      if(j===i||usedPins.has(j)||shuffled[j].icIdx===p.icIdx)continue;
      const d=Math.abs(p.r-shuffled[j].r)+Math.abs(p.c-shuffled[j].c);
      if(d<bestD&&d>2){bestD=d;bestJ=j;}
    }
    if(bestJ>=0){
      const q=shuffled[bestJ];
      routeL(p.r,p.c,q.r,q.c,false,Math.min(p.t,q.t)+0.025,p.dark||q.dark);
      usedPins.add(i); usedPins.add(bestJ);
    }
  }

  // ── fill-in signal walkers ────────────────────────────────────────
  const allW=[];
  for(let i=0;i<shuffled.length;i++){
    if(usedPins.has(i))continue;
    const p=shuffled[i];
    if(!ok(p.r,p.c))continue;
    allW.push({r:p.r,c:p.c,dir:Math.floor(Math.random()*4),bold:false,dark:p.dark||false,
      maxLen:4+Math.floor(Math.random()*16),t:p.t+0.05,straight:0,minSt:3});
  }
  const N_EXTRA=80+Math.floor(Math.random()*50);
  for(let i=0;i<N_EXTRA;i++){
    const r=Math.floor(Math.random()*ccRows),c=Math.floor(Math.random()*ccCols);
    allW.push({r,c,dir:Math.floor(Math.random()*4),bold:false,dark:false,
      maxLen:6+Math.floor(Math.random()*18),t:kTime(r,c)+0.05,straight:0,minSt:3});
  }
  let step=0;
  const MAX=14000;
  while(allW.length&&step<MAX){
    step++;
    for(let wi=allW.length-1;wi>=0;wi--){
      const w=allW[wi];
      w.t+=0.00008; w.straight++;
      if(w.straight>=w.minSt){
        const rn=Math.random();
        if(rn<0.24){w.dir=(w.dir+1)&3;w.straight=0;}
        else if(rn<0.48){w.dir=(w.dir+3)&3;w.straight=0;}
      }
      const nr=w.r+DY[w.dir],nc=w.c+DX[w.dir];
      if(!ok(nr,nc)){w.dir=(w.dir+(Math.random()<.5?1:3))&3;w.straight=0;continue;}
      mark(w.r,w.c,MY[w.dir],w.bold,kTime(w.r,w.c)+w.t,w.dark);
      mark(nr,nc,OPP[w.dir],w.bold,kTime(nr,nc)+w.t,w.dark);
      w.r=nr;w.c=nc;
      if(--w.maxLen<=0){allW.splice(wi,1);continue;}
      if(Math.random()<0.018&&w.straight>3){
        const bd=(w.dir+(Math.random()<.5?1:3))&3;
        allW.push({r:w.r,c:w.c,dir:bd,bold:false,dark:w.dark,
          maxLen:4+Math.floor(Math.random()*12),t:w.t,straight:0,minSt:3});
      }
    }
    if(step%500===0&&step<MAX*.7){
      const r=Math.floor(Math.random()*ccRows),c=Math.floor(Math.random()*ccCols);
      allW.push({r,c,dir:Math.floor(Math.random()*4),bold:false,dark:false,
        maxLen:8+Math.floor(Math.random()*22),t:kTime(r,c),straight:0,minSt:3});
    }
  }

  // ── post: vias at junctions, label chars on traces ─────────────────
  for(let r=0;r<ccRows;r++) for(let c=0;c<ccCols;c++){
    const ce=cc(r,c); if(!ce.marked)continue;
    const bits=ce.rlud&0xF;
    const n=(bits>>3&1)+(bits>>2&1)+(bits>>1&1)+(bits&1);
    if(n>=3&&Math.random()<0.25) ce.via=VIAS[Math.floor(Math.random()*VIAS.length)];
    if(n===2&&Math.random()<0.04&&!ce.lbl) ce.lbl=LBLS[20+Math.floor(Math.random()*13)];
  }

  // ── normalise ──────────────────────────────────────────────────────
  let mx=0;
  for(const ce of ccGrid) if(ce.marked&&ce.time>mx) mx=ce.time;
  if(mx>0) for(const ce of ccGrid) if(ce.marked) ce.time/=mx;

  // pre-compute positions + sorted array
  for(let r=0;r<ccRows;r++) for(let c=0;c<ccCols;c++){
    const ce=ccGrid[r*ccCols+c];
    ce._x=c*CC+CC*.5; ce._y=r*CC+CC*.62;
  }
  const sorted=ccGrid.filter(ce=>ce.marked).sort((a,b)=>a.time-b.time);
  return sorted;
}

function buildCircuits(){
  ccSortedA = buildOneLayer(); // phase 1 lime circuits
  ccSortedB = buildOneLayer(); // phase 1 black circuits, phase 2 unbuild
  ccSortedC = buildOneLayer(); // phase 4 lime circuits, phase 5 unbuild
  ccSortedD = buildOneLayer(); // phase 4 black circuits
}

function drawCircuits(sorted,prog,ca,cb,bgColor){
  ctx.font=CFONT; ctx.textAlign='center'; ctx.textBaseline='middle';
  const useBold=prog>0.40, useVia=prog>0.68;
  let cur=null;
  for(const ce of sorted){
    if(ce.time>prog)break;
    const col=ce.dark?cb:ca;
    // skip cells whose color matches the background — invisible anyway
    if(bgColor&&col===bgColor)continue;
    if(col!==cur){ctx.fillStyle=cur=col;}
    if(ce.lbl){ ctx.fillText(ce.lbl,ce._x,ce._y); continue; }
    const ch=(useBold&&ce.bold?BOLD:THIN)[ce.rlud&0xF]||'\xB7';
    ctx.fillText(ch,ce._x,ce._y);
    if(useVia&&ce.via) ctx.fillText(ce.via,ce._x,ce._y);
  }
}

// ══════════════════════════════════════════════════════════════════
// PIXEL LAYER  –  glitch = integer multiples of block size
// ══════════════════════════════════════════════════════════════════
const PX=[{sz:16,t0:0.10,t1:.46},{sz:8,t0:0.13,t1:.74},{sz:4,t0:0.16,t1:1}];
let pxBlocks,pxBlocksB,pxGlitch;

let BrightFn, BrightFn2;
const BrightPool=[];

function brightEarth(nx,ny){
  const ed=Math.sqrt((nx-.5)**2+((ny-.2)*1.5)**2);
  const earth=Math.exp(-ed*ed/0.052)*.88;
  const md=Math.sqrt((nx-.5)**2*.85+(ny-1.0)**2);
  const moon=md<0.9?Math.pow(Math.max(0,1-md/0.9),0.35)*.7:0;
  const s=Math.sin(nx*2311+ny*4271)*.5+.5;
  return Math.min(1,earth+moon+(s>.984?.5:0));
}
function brightCross(nx,ny){
  const cx=Math.abs(nx-.5),cy=Math.abs(ny-.5);
  const arm=Math.max(0,1-Math.min(cx,cy)*9)*.9;
  const center=Math.exp(-(cx*cx+cy*cy)*28)*.95;
  return Math.min(1,arm+center);
}
function brightVortex(nx,ny){
  const dx=nx-.5,dy=ny-.5;
  const r=Math.sqrt(dx*dx+dy*dy);
  const a=Math.atan2(dy,dx);
  const spiral=Math.pow(Math.max(0,1-r*1.6),.5);
  return Math.min(1,spiral+(Math.sin(a*5-r*12)*.5+.5)*.6*spiral);
}
function brightRings(nx,ny){
  const dx=nx-.5,dy=ny-.5;
  const r=Math.sqrt(dx*dx+dy*dy*1.3);
  return Math.pow(Math.max(0,Math.sin(r*18+.4)*.5+.5),1.5)*.92;
}

function makeImgBrightness(dataUri){
  return new Promise(resolve=>{
    const img=new Image();
    img.onload=()=>{
      const SW=img.naturalWidth,SH=img.naturalHeight;
      const oc=Object.assign(document.createElement('canvas'),{width:SW,height:SH});
      oc.getContext('2d').drawImage(img,0,0,SW,SH);
      const d=oc.getContext('2d').getImageData(0,0,SW,SH).data;
      resolve((nx,ny)=>{
        const px=Math.min(SW-1,Math.floor(nx*SW));
        const py=Math.min(SH-1,Math.floor(ny*SH));
        const i=(py*SW+px)*4;
        return (d[i]*.299+d[i+1]*.587+d[i+2]*.114)/255;
      });
    };
    img.onerror=()=>resolve(null);
    img.src=dataUri;
  });
}

async function preloadBrightness(){
  BrightPool.push(brightEarth,brightCross,brightVortex,brightRings);
  for(const uri of [IMG_SKULL,IMG_HERO]){
    const fn=await makeImgBrightness(uri);
    if(fn) BrightPool.push(fn);
  }
}

function buildPixels(){
  pxBlocks=[];
  const bright=BrightFn||brightEarth;
  for(const{sz,t0,t1}of PX){
    const cols=Math.ceil(W/sz),rows=Math.ceil(H/sz),span=t1-t0;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const br=bright((c+.5)/cols,(r+.5)/rows);
      const t=t0+span*(1-br*.94)+(Math.random()-.5)*.04;
      pxBlocks.push({x:c*sz,y:r*sz,sz,t:Math.max(0,Math.min(1,t))});
    }
  }
  pxBlocks.sort((a,b)=>a.t-b.t);

  // secondary pixel set (lime scatter in black areas during decomp)
  pxBlocksB=[];
  const bright2=BrightFn2||brightCross;
  for(const{sz,t0,t1}of PX){
    const cols=Math.ceil(W/sz),rows=Math.ceil(H/sz),span=t1-t0;
    for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
      const br=bright2((c+.5)/cols,(r+.5)/rows);
      const t=t0+span*(1-br*.94)+(Math.random()-.5)*.04;
      pxBlocksB.push({x:c*sz,y:r*sz,sz,t:Math.max(0,Math.min(1,t))});
    }
  }
  pxBlocksB.sort((a,b)=>a.t-b.t);

  // per-band glitch: bands are 1–12 rows tall; most get moderate offsets,
  // a few "tear" bands get extreme offsets (30–60 blocks)
  const maxRows=Math.ceil(H/4)+8;
  pxGlitch=new Float32Array(maxRows);
  let i=0;
  while(i<maxRows){
    const bh=1+Math.floor(Math.random()*12);
    const extreme=Math.random()<0.12; // ~1-in-8 bands tear wildly
    const mag=extreme?(30+Math.floor(Math.random()*32)):(2+Math.floor(Math.random()*22));
    const blocks=mag*(Math.random()<.5?1:-1);
    for(let j=0;j<bh&&i<maxRows;j++,i++) pxGlitch[i]=blocks;
  }
}

function drawPixels(blocks,prog,color){
  const gAmt=Math.max(0,1-prog/0.72);
  ctx.fillStyle=color;
  const epoch=Math.floor(Date.now()/190);
  function prng(a,b){const x=Math.sin(a*127.1+b*311.7)*43758.5453;return x-Math.floor(x);}
  for(const b of blocks){
    if(b.t>prog)break;
    const rowBand=Math.floor(b.y/b.sz);
    const blockId=b.x/b.sz+rowBand*4096;
    // dropout: each block is deterministically on/off per epoch, no per-frame flicker
    if(gAmt>0.05&&prng(epoch*3+5,blockId)<gAmt*0.18)continue;
    const staticOff=Math.round(pxGlitch[rowBand]*gAmt)*b.sz;
    const hasDyn=prng(epoch,rowBand)<0.12;
    const dynOff=hasDyn?Math.round((prng(epoch+1,rowBand)-.5)*6*gAmt)*b.sz:0;
    const dx=((b.x+staticOff+dynOff)%W+W)%W;
    ctx.fillRect(dx,b.y,b.sz,b.sz);
  }
}

// ══════════════════════════════════════════════════════════════════
// ANIMATION
// ══════════════════════════════════════════════════════════════════
// Phase durations (ms)
const T_BUILD      = 5500;  // black bg → pixels + circuits grow together
const T_ASCII_OUT  = 1000;  // lime bg  → circuits unbuild → pure lime
const T_HOLD       = 350;   // pure lime hold
const T_DECOMP     = 5000;  // lime bg  → pixels eat to black + new circuits build
const T_CIRCUIT_OUT= 1000;  // all-black → circuits unbuild → pure black
const T_TOTAL=T_BUILD+T_ASCII_OUT+T_HOLD+T_DECOMP+T_CIRCUIT_OUT;
let animId=null,t0=null,MODE='both';

function tick(ts){
  if(t0===null)t0=ts;
  let e=ts-t0;
  if(e>=T_TOTAL){ctx.fillStyle=BLACK;ctx.fillRect(0,0,W,H);animId=null;return;}

  if(e<T_BUILD){
    // Phase 1 – BUILD: black bg, lime pixels + dual ASCII (lime + black) grow together
    const p=e/T_BUILD;
    ctx.fillStyle=BLACK;ctx.fillRect(0,0,W,H);
    if(MODE!=='circuits')drawPixels(pxBlocks,p,LIME);
    if(MODE!=='pixels'){
      drawCircuits(ccSortedA,p,LIME,BLACK);  // lime ASCII: visible on black bg
      drawCircuits(ccSortedB,p,BLACK,LIME);  // black ASCII: visible on lime pixel areas
    }
  } else if((e-=T_BUILD)<T_ASCII_OUT){
    // Phase 2 – BLACK ASCII OUT: lime bg, black circuits unbuild → pure lime
    const p=e/T_ASCII_OUT;
    ctx.fillStyle=LIME;ctx.fillRect(0,0,W,H);
    if(MODE!=='pixels')  drawCircuits(ccSortedB,1-p,BLACK,LIME,LIME);
  } else if((e-=T_ASCII_OUT)<T_HOLD){
    // Phase 3 – HOLD: pure lime
    ctx.fillStyle=LIME;ctx.fillRect(0,0,W,H);
  } else if((e-=T_HOLD)<T_DECOMP){
    // Phase 4 – DECOMP: lime bg, black pixels eat in + lime scatter + dual ASCII
    const p=e/T_DECOMP;
    ctx.fillStyle=LIME;ctx.fillRect(0,0,W,H);
    if(MODE!=='circuits'){
      drawPixels(pxBlocksB,p,LIME);   // lime scatter (drawn under black pixels)
      drawPixels(pxBlocks,p,BLACK);   // black pixels eat in on top
    }
    if(MODE!=='pixels'){
      drawCircuits(ccSortedD,p,BLACK,LIME); // black ASCII on lime areas
      drawCircuits(ccSortedC,p,LIME,BLACK); // lime ASCII on black areas
    }
  } else {
    // Phase 5 – CIRCUIT OUT: full black coverage, lime ASCII unbuilds → pure black
    e-=T_DECOMP;
    const p=e/T_CIRCUIT_OUT;
    ctx.fillStyle=LIME;ctx.fillRect(0,0,W,H);
    if(MODE!=='circuits'){
      drawPixels(pxBlocksB,1.0,LIME); // lime scatter (fully covered by black below)
      drawPixels(pxBlocks,1.0,BLACK); // full black coverage
    }
    if(MODE!=='pixels')  drawCircuits(ccSortedC,1-p,LIME,BLACK,BLACK);
  }
  animId=requestAnimationFrame(tick);
}

function run(mode){
  if(animId){cancelAnimationFrame(animId);animId=null;}
  MODE=mode||'both';
  resize();
  BrightFn=BrightPool.length?BrightPool[Math.floor(Math.random()*BrightPool.length)]:brightEarth;
  BrightFn2=BrightPool.length?BrightPool[Math.floor(Math.random()*BrightPool.length)]:brightCross;
  buildCircuits();
  buildPixels();
  t0=null;
  animId=requestAnimationFrame(tick);
}

window.addEventListener('load',async()=>{await preloadBrightness();run('both');});
</script>
